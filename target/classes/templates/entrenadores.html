<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenadores · Fútbol Manager</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<button class="btn btn-ghost mobile-toggle" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar('entrenadores')}"></div>
  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <h1>Entrenadores</h1>
        <p>Cuerpo técnico disponible</p>
      </div>
      <div class="actions">
        <a class="btn btn-primary" th:href="@{/gestion}">Gestionar</a>
        <a class="btn btn-ghost" th:href="@{/api/entrenadores}" target="_blank">JSON API</a>
      </div>
    </div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="panel">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr><th>ID</th><th>Nombre</th><th>Edad</th><th>Nacionalidad</th></tr>
          </thead>
          <tbody>
            <tr th:each="e : ${entrenadores}">
              <td th:text="${e.id}"></td>
              <td th:text="${e.nombre + ' ' + e.apellido}"></td>
              <td th:text="${e.edad}"></td>
              <td th:text="${e.nacionalidad}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</body>
</html>
