<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión · Fútbol Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<button class="btn btn-ghost mobile-toggle" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar('gestion')}"></div>
  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <h1>Gestión de datos</h1>
        <p>Alta, edición y baja de todas las entidades</p>
      </div>
    </div>
    <div class="alert alert-info">
      Orden sugerido: entrenadores → asociaciones → jugadores → competiciones → clubes.
    </div>
    <div class="panel">
      <div class="panel-body">
        <ul class="nav nav-tabs mb-3" id="tabs" role="tablist"></ul>
        <div class="tab-content" id="paneles"></div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/gestion.js}"></script>
</body>
</html>
